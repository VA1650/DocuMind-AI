<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DocuMind AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <script>
        function syncRepo() {
            const path = document.getElementById('repoPath').value;
            const resultDiv = document.getElementById('syncResult');
            resultDiv.innerHTML = "⏳ Чтение файлов и подпапок...";

            fetch(`/api/ai/load-repo?path=${encodeURIComponent(path)}`)
                .then(response => response.text())
                .then(data => {
                    resultDiv.innerHTML = `<span class="text-emerald-400">✓ ${data}</span>`;
                })
                .catch(err => {
                    resultDiv.innerHTML = `<span class="text-red-400">✕ Ошибка: ${err}</span>`;
                });
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center p-8">

<div class="w-full max-w-3xl bg-gray-800 rounded-xl p-6 shadow-2xl space-y-6">
    <h1 class="text-3xl font-bold text-emerald-400 text-center">🧠 DocuMind AI Assistant</h1>

    <div class="border border-gray-700 rounded-lg p-6 bg-gray-850">
        <h2 class="text-xl font-bold mb-4 text-emerald-400">Шаг 1: Синхронизация локальной документации</h2>
        <div class="flex gap-2">
            <input type="text" id="repoPath"
                   value="D:/Projects/my-project-docs"
                   class="flex-1 p-3 bg-gray-700 rounded border border-gray-600 text-white font-mono focus:outline-none focus:border-emerald-500"
                   placeholder="Укажите абсолютный путь к папке">
            <button type="button" onclick="syncRepo()"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded font-medium transition shadow-sm">
                Просканировать папку
            </button>
        </div>
        <div id="syncResult" class="mt-3 text-sm text-gray-400"></div>
    </div>

    <div class="border border-gray-700 rounded-lg p-6 bg-gray-850 flex flex-col space-y-4">
        <h2 class="text-lg font-semibold text-gray-300">Шаг 2: Задаем вопросы по контексту</h2>

        <div id="chat-window" class="h-64 overflow-y-auto border border-gray-700 rounded p-4 bg-gray-750 space-y-2 text-sm">
            <div class="text-gray-400 italic">Тут появятся ответы на основе твоих документов...</div>
        </div>

        <form hx-get="/api/ai/chat"
              hx-target="#chat-window"
              hx-swap="beforeend"
              hx-on="htmx:afterRequest: this.reset()"
              class="flex gap-3 bg-gray-800 p-2 rounded-lg border border-gray-700 items-center">

            <input type="text"
                   name="question"
                   id="questionInput"
                   class="flex-1 p-3 bg-gray-700 text-white rounded border border-gray-600 focus:outline-none focus:border-emerald-500 placeholder-gray-400"
                   placeholder="Задайте вопрос по документации...">

            <button type="submit"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded font-medium transition shadow-sm">
                Спросить
            </button>
        </form>
    </div>
</div>

</body>
</html>
